# Publish only the site. The repo also holds dev/ (tests) and notes; those never reach harnashq.com.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude 'dev' --exclude '_site' \
            --exclude '*.md' --exclude 'package.json' --exclude '.gitignore' --exclude '.DS_Store'
          echo "Published files:"; find _site -type f -not -path '_site/img/seq/*' | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
